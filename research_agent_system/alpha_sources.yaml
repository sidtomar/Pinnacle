# ═══════════════════════════════════════════════════════════════
# Agent Alpha — Research Source Configuration
# ═══════════════════════════════════════════════════════════════
#
# This file controls which sources Agent Alpha searches.
#
# TWO MODES:
#   "demo"       → ALL sources enabled (showcase full capabilities)
#   "production"  → Only admin-approved sources are active
#
# For demo: set mode to "demo" and all sources work automatically.
# For production: set mode to "production" and configure each
#   source's "production_enabled" flag as per business decision.
#
# Admin can switch modes anytime. No code changes required.
# ═══════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────┐
# │  MODE SWITCH                                                │
# │  "demo"       → All sources ON (for management demos)      │
# │  "production" → Only production_enabled sources are active  │
# └─────────────────────────────────────────────────────────────┘
mode: demo


# ═══════════════════════════════════════════════════════════════
# SOURCES
# ═══════════════════════════════════════════════════════════════
#
# Each source has:
#   production_enabled : true/false — used ONLY when mode is "production"
#   description        : human-readable name shown in logs & UI
#   tool               : internal tool name (do not change)
#   priority           : search order (1 = first, higher = later)
#   requires           : env vars needed for this source to work
#   settings           : source-specific configuration
#
# In "demo" mode, ALL sources are enabled regardless of
# production_enabled flag — this lets you showcase everything.
# ═══════════════════════════════════════════════════════════════

sources:

  # ── SOURCE 1: PubMed (NCBI E-utilities) ──────────────────────
  # Primary source — peer-reviewed medical literature.
  # Free API. Optional NCBI_API_KEY for higher rate limits.
  pubmed:
    production_enabled: true
    description: "PubMed — peer-reviewed medical literature via NCBI"
    tool: search_pubmed
    priority: 1
    requires: []    # No API key required (optional: NCBI_API_KEY)

  # ── SOURCE 2: Local Content Repository ───────────────────────
  # MA team documents stored locally (.txt, .pdf, .docx, .xlsx).
  # Path: LOCAL_DOCS_PATH env var or default <project_root>/Research/
  local_content_repo:
    production_enabled: true
    description: "Local content repo — MA team documents on disk"
    tool: read_local_docs
    priority: 2
    requires: []    # No credentials needed — reads local files
    settings:
      path: "Research/"    # Override with LOCAL_DOCS_PATH env var

  # ── SOURCE 3: Databricks Vector Search ──────────────────────
  # Semantic search over MA document library in Databricks.
  # Requires Azure Databricks credentials in .env
  databricks_vector_search:
    production_enabled: false
    description: "Databricks Vector Search — semantic search over MA library"
    tool: search_vector_store
    priority: 3
    requires:
      - DATABRICKS_HOST
      - DATABRICKS_TOKEN
    settings:
      endpoint: "pinnacleiq_vs"
      index: "pinnacleiq.medical_content.document_chunks_index"
      embedding_model: "databricks-bge-large-en"

  # ── SOURCE 4: Tavily Web Search ─────────────────────────────
  # Real-time web search for recent medical articles & clinical data.
  # Requires Tavily API key in .env
  tavily_web_search:
    production_enabled: false
    description: "Tavily — real-time web search for medical articles"
    tool: build_tavily_tool
    priority: 4
    requires:
      - TAVILY_API_KEY
    settings:
      max_results: 5

  # ── SOURCE 5: OneDrive (Microsoft Graph API) ────────────────
  # Shared MA documents on OneDrive/SharePoint.
  # Requires Microsoft Azure AD app credentials in .env
  onedrive:
    production_enabled: false
    description: "OneDrive — shared MA documents via Microsoft Graph API"
    tool: read_onedrive_files
    priority: 5
    requires:
      - ONEDRIVE_CLIENT_ID
      - ONEDRIVE_CLIENT_SECRET
      - ONEDRIVE_TENANT_ID
    settings:
      folder_path: "PinnacleIQ/Research"


# ═══════════════════════════════════════════════════════════════
# QUICK REFERENCE
# ═══════════════════════════════════════════════════════════════
#
# TO DEMO (show all capabilities to management):
#   mode: demo
#   → All 5 sources active. No other changes needed.
#
# TO GO LIVE (production — admin configures):
#   mode: production
#   → Only sources with "production_enabled: true" are active.
#   → Admin sets each source's flag based on business decision.
#
# EXAMPLE — Production with PubMed + Databricks only:
#   mode: production
#   pubmed:                    production_enabled: true
#   local_content_repo:        production_enabled: false
#   databricks_vector_search:  production_enabled: true   # + set .env creds
#   tavily_web_search:         production_enabled: false
#   onedrive:                  production_enabled: false
#
# EXAMPLE — Production with PubMed + Local repo only:
#   mode: production
#   pubmed:                    production_enabled: true
#   local_content_repo:        production_enabled: true
#   databricks_vector_search:  production_enabled: false
#   tavily_web_search:         production_enabled: false
#   onedrive:                  production_enabled: false
# ═══════════════════════════════════════════════════════════════
